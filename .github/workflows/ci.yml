name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan the release tree for committed secrets
        run: '"$RUNNER_TEMP/gitleaks" dir --redact --no-banner .'

  backend:
    name: Backend (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      BROADCAST_CONNECTION: "null"
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pcntl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install --yes sqlite3

      - name: Locate Composer cache
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          ../scripts/prepare-sqlite-tests
          php artisan key:generate --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Check backend formatting
        run: vendor/bin/pint --test

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Run backend tests
        run: php artisan test

  backend-postgres:
    name: Backend (PostgreSQL 17 + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_DB: orvyn_test
          POSTGRES_USER: orvyn_ci
          POSTGRES_PASSWORD: orvyn-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=orvyn_ci --dbname=orvyn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      BROADCAST_CONNECTION: "null"
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: orvyn_test
      DB_USERNAME: orvyn_ci
      DB_PASSWORD: orvyn-ci-only-password
      DB_URL: ""
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pcntl, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Verify PostgreSQL migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run backend tests against PostgreSQL
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Type-check mobile app
        run: npm run typecheck

      - name: Run Expo Doctor
        run: npm run doctor

      - name: Export mobile bundles
        run: npx expo export --platform all --output-dir .ci-export --clear

      - name: Audit mobile runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  whatsapp:
    name: WhatsApp Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatsapp-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: whatsapp-service/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Type-check WhatsApp service
        run: npm run check

      - name: Build WhatsApp service
        run: npm run build

      - name: Audit WhatsApp dependencies
        run: npm audit --omit=dev --audit-level=high

  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check MCP server syntax
        run: npm run check

      - name: Run MCP tests
        run: npm test

      - name: Audit MCP dependencies
        run: npm audit --omit=dev --audit-level=high
